services:
  - type: web
    name: ai-customer-support-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build:backend
    startCommand: npm --prefix backend run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ai-customer-support-web
    runtime: static
    region: singapore
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
